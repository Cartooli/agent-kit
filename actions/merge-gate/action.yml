name: merge-gate
description: >-
  Fails while a PR is held: a `hold` label, gate phrases in the title or body, an
  unchecked "Before merge" box, or any open item under "Needed from the owner".
  One shared copy for every repo; logic lives in gate.sh (tested by tests/test_merge_gate.sh).
inputs:
  github-token:
    description: Token with pull-requests:read on the calling repo.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Read the PR and decide
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GATE: ${{ github.action_path }}/gate.sh
      run: |
        set -euo pipefail
        if [ -z "${PR_NUMBER:-}" ]; then
          echo "::error::merge-gate runs on pull_request events only"; exit 1
        fi
        # Read the PR fresh rather than trusting the event payload.
        pr=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
        export PR_TITLE PR_BODY PR_LABELS
        PR_TITLE=$(printf '%s' "$pr" | jq -r '.title // ""')
        PR_BODY=$(printf '%s' "$pr" | jq -r '.body // ""')
        PR_LABELS=$(printf '%s' "$pr" | jq -c '[.labels[].name]')
        bash "$GATE"
