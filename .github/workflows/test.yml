name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/test_guard.sh
      - run: bash tests/test_merge_gate.sh
