name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash tests/test_guard.sh
      - run: bash tests/test_merge_gate.sh
      - run: bash tests/test_live_check.sh
      - run: bash tests/test_handoff.sh
      - run: bash tests/test_sweeps.sh
      - run: bash tests/test_version.sh
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
