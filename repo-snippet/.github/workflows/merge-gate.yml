# merge-gate caller. The logic lives once in agent-kit (actions/merge-gate); this file
# only says when to run it. Keep the job name `merge-gate`: a required check with that
# name keeps working when a repo moves from its own copy to this caller.
# Replace OWNER and pin REF to a commit SHA of agent-kit's main branch.
name: merge-gate

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  merge-gate:
    name: merge-gate
    # Only PR comments carrying the override phrase can change the answer; skip the rest.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, 'merged by the owner'))
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - uses: OWNER/agent-kit/actions/merge-gate@REF
