# live-check caller. The logic lives once in agent-kit (actions/live-check); this file only
# says when to run it. Add it with a .livecheck.json at the repo root (see
# repo-snippet/.livecheck.json) and nothing else: no secret, no Vercel token.
# Replace OWNER and pin REF to a commit SHA of agent-kit's main branch.
#
# Vercel's Git integration posts a commit status ("Vercel", or "Vercel – <project>" when
# several projects build one repo) on every deploy. Newer Vercel projects post only that, not a
# GitHub deployment, so this runs on the status. It counts a success on a commit of the default
# branch as the production deploy. A healthy deploy costs about 20 seconds of a slim runner.
# If several Vercel projects build this repo, replace the context test in `if:` with the exact
# context of the project that serves base_url, e.g. github.event.context == 'Vercel – my-app'.
name: live-check

on:
  status:
  workflow_dispatch:
    inputs:
      drill:
        description: "Drill the failure path: revert (opens and closes a revert PR) or issue"
        type: choice
        options: [revert, issue]
        default: revert

permissions:
  contents: write        # push the revert branch
  pull-requests: write   # open and squash-merge the revert PR
  issues: write          # open the failure issue, create labels
  actions: read          # read the previous live-check result

jobs:
  live-check:
    name: live-check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.state == 'success' &&
       (github.event.context == 'Vercel' || startsWith(github.event.context, 'Vercel – ')) &&
       contains(github.event.branches.*.name, github.event.repository.default_branch))
    # Job-level, so preview and other status events (skipped by the `if`) never displace a
    # queued production run.
    concurrency:
      group: live-check-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-slim
    timeout-minutes: 6
    steps:
      - uses: OWNER/agent-kit/actions/live-check@REF
        with:
          drill: ${{ inputs.drill || 'none' }}
